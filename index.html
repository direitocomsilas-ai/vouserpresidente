<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Vou Ser Presidente</title>
<meta name="description" content="O mapa do Brasil decidido nos comentários do @vouserpresidente.">
<meta property="og:title" content="Vou Ser Presidente">
<meta property="og:description" content="Escolha seu lado e ganhe sua casa no mapa do Brasil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: mapa 3D quase de cima em tela cheia; título + busca no topo, zoom à direita, contagem + atalhos embaixo, painel da cidade à direita (folha inferior no celular) */
:root{
  --sky:#a9d8f2; --ink:#1b1d24; --paper:#ffffff; --muted:#5b6274; --line:#e7eaf1;
  --sun:#ffc93c; --blue:#2f6fec; --red:#e5484d; --on:#ffffff;
  --display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%;overflow:hidden}
#c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.out{font-family:var(--display);font-weight:400;color:var(--paper);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:0 4px 0 var(--ink)}
.chip{font-family:var(--display);font-weight:400;font-size:17px;border:3px solid var(--ink);border-radius:99px;background:var(--paper);padding:7px 16px;cursor:pointer;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.chip.y{background:var(--sun)}
.chip[disabled]{opacity:.6;cursor:default}

/* Topo */
#top{position:absolute;top:max(12px,env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:5;display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
#top>*{pointer-events:auto}
.ttl{display:flex;align-items:center;gap:12px;width:100%;max-width:640px;justify-content:center;position:relative}
.ttl h1{margin:0;font-size:clamp(30px,6vw,46px);line-height:1;text-align:center}
.ttl h1 em{font-style:normal;color:var(--sun)}
.help{position:absolute;right:0;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);font-family:var(--display);font-size:22px;cursor:pointer;box-shadow:0 4px 0 var(--ink)}
#sform{display:flex;gap:10px;width:100%;max-width:640px;position:relative}
.sbox{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--paper);border:4px solid var(--ink);border-radius:99px;padding:0 16px;box-shadow:0 5px 0 var(--ink)}
.sbox b{font-family:var(--display);font-size:22px;color:var(--muted)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;font:800 18px var(--body);padding:12px 0;color:var(--ink)}
#q::placeholder{color:#9aa1ae}
.go{font-family:var(--display);font-size:20px;border:4px solid var(--ink);border-radius:99px;background:var(--sun);padding:0 22px;cursor:pointer;box-shadow:0 5px 0 var(--ink)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
#sug{position:absolute;top:calc(100% + 10px);left:0;right:0;list-style:none;margin:0;padding:6px;z-index:7}
#sug li button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;border:0;background:transparent;padding:9px 10px;border-radius:12px;cursor:pointer;font-weight:800;font-size:15px}
#sug li button:hover,#sug li button:focus-visible{background:var(--line)}
#sug li small{color:var(--muted);font-weight:800;white-space:nowrap}
.merow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.side{font-family:var(--display);font-size:15px;border:3px solid var(--ink);border-radius:99px;padding:4px 12px;background:var(--paper);cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.side.b[aria-pressed="true"]{background:var(--blue);color:var(--on)}
.side.r[aria-pressed="true"]{background:var(--red);color:var(--on)}
.merow.need .side{animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}
.mine{display:flex;align-items:center;gap:6px;font-weight:900;font-size:14px;background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:2px 12px 2px 4px;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.mine img{width:30px;height:30px}

/* Rótulos */
#labels{position:absolute;inset:0;pointer-events:none;z-index:1}
.lab{position:absolute;transform:translate(-50%,-100%);text-align:center;cursor:pointer;pointer-events:auto;line-height:1.05;white-space:nowrap}
.lab .n{font-size:22px;-webkit-text-stroke:5px var(--ink)}
.lab .k{display:block;font-size:14px;color:var(--sun);-webkit-text-stroke:4px var(--ink)}
.lab.sel .n{color:var(--sun)}
.lab .f{display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:3px 6px 3px 10px;font:900 13px var(--body);color:var(--ink)}
.lab .f em{font-style:normal;background:var(--sun);border-radius:99px;padding:1px 7px;font-size:10.5px;letter-spacing:.04em}

/* Zoom */
#zoom{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;z-index:4}
#zoom button{width:56px;height:56px;border-radius:50%;border:4px solid var(--ink);background:var(--paper);font-family:var(--display);font-size:28px;cursor:pointer;box-shadow:0 4px 0 var(--ink);display:grid;place-items:center}
#zoom button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

/* Base */
#bottom{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4;pointer-events:none}
#bottom>*{pointer-events:auto}
#count{font-size:clamp(22px,4vw,30px);text-align:center;font-variant-numeric:tabular-nums}
.nat{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:15px;width:min(420px,100%)}
.nat .b{color:var(--blue)} .nat .r{color:var(--red)}
.bar{flex:1;height:14px;border:3px solid var(--ink);border-radius:99px;overflow:hidden;display:flex;background:var(--line)}
.bar i{display:block;height:100%;transition:width .5s}
.bar .b{background:var(--blue)} .bar .r{background:var(--red)}
#ticker{font-weight:800;font-size:13px;background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:3px 12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

/* Painel */
#panel{position:absolute;top:200px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 72px);width:340px;max-height:calc(100% - 380px);min-height:200px;overflow:auto;padding:16px;z-index:6}
#panel .x,.mx{position:absolute;top:10px;right:10px;width:34px;height:34px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);cursor:pointer;font-weight:900}
.city-h{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:0 40px 6px 0;text-wrap:balance}
.badge{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:12px;padding:3px 10px;border-radius:99px;border:2px solid var(--ink);color:var(--on)}
.badge.b{background:var(--blue)} .badge.r{background:var(--red)} .badge.n{background:var(--line);color:var(--ink)}
.sec{margin-top:14px}
.sec h3{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 6px}
.split{display:flex;justify-content:space-between;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums}
.split .b{color:var(--blue)} .split .r{color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:2px solid var(--ink);border-radius:12px;padding:8px 10px;min-width:0}
.tile b{display:block;font-family:var(--display);font-weight:400;font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:11px;color:var(--muted);font-weight:800}
.meter{height:8px;border-radius:99px;background:var(--line);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:99px}
.who{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none;display:inline-block}
.dot.b{background:var(--blue)} .dot.r{background:var(--red)}
.camara{display:flex;gap:5px;flex-wrap:wrap}
.ppl{display:flex;flex-wrap:wrap;gap:5px}
.pp{display:inline-flex;align-items:center;gap:4px;font-weight:800;font-size:12.5px;padding:2px 8px 2px 2px;border-radius:99px;background:var(--line);border:2px solid transparent}
.pp img{width:24px;height:24px}
.pp.hl{background:var(--sun);border-color:var(--ink)}
.acts{display:grid;gap:8px}
.act{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:3px solid var(--ink);border-radius:14px;padding:9px 12px;background:var(--sun);cursor:pointer;box-shadow:0 3px 0 var(--ink);font-weight:900}
.act:active{transform:translateY(3px);box-shadow:none}
.act small{font-family:var(--display);font-weight:400;font-size:15px}
.act[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:none}
.mob{display:flex;gap:6px}
.mob input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font:inherit;font-weight:700}
.mob .act{width:auto;flex:none}
.note{font-size:11.5px;color:var(--muted);font-weight:700;line-height:1.45;margin:8px 0 0}

/* Modal */
#modal{position:absolute;inset:0;z-index:9;background:rgba(27,29,36,.45);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal>.card{width:100%;max-width:640px;max-height:100%;overflow:auto;padding:20px;position:relative}
#modal h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0 44px 6px 0;line-height:1.05}
#modal p{margin:0 0 10px;font-weight:700;font-size:14px;color:var(--muted);line-height:1.5;max-width:62ch}
#modal textarea{width:100%;min-height:180px;border:2px solid var(--ink);border-radius:12px;padding:10px;font:600 13px/1.45 var(--body);resize:vertical;box-sizing:border-box}
.mrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.mrow label{font-weight:800;font-size:13px;display:flex;gap:6px;align-items:center}
.mrow .grow{flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
.tw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 6px;border-bottom:2px solid var(--ink)}
td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
td img{width:30px;height:30px;vertical-align:middle}
td.why{color:var(--muted)}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.lv div{border:3px solid var(--ink);border-radius:16px;padding:8px;text-align:center;background:var(--sky)}
.lv img{width:100%;max-width:120px;aspect-ratio:1}
.lv b{display:block;font-family:var(--display);font-weight:400;font-size:15px;line-height:1.1}
.lv span{font-size:11px;font-weight:800;color:var(--muted)}
#modal>.card.wide{max-width:860px}
.rules{display:grid;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:baseline;font-weight:700;font-size:14px}
.rules b{font-family:var(--display);font-weight:400;font-size:16px;min-width:64px;color:var(--ink)}

.mine{cursor:pointer;position:relative}
.mine:hover{background:var(--line)}
.bdg{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:var(--on);font-size:12px;font-weight:900;border:2px solid var(--ink)}
.pp.go{cursor:pointer;font:inherit;font-weight:800;font-size:12.5px;color:var(--ink);border:2px solid var(--ink)}
.pp.go:hover{background:var(--sun)}
.prof .ph{display:flex;gap:12px;align-items:center;margin-right:40px}
.prof .ph img{width:84px;height:84px;flex:none;background:var(--sky);border:3px solid var(--ink);border-radius:18px}
.prof .ph h2{margin:0 0 6px!important}
.phs{display:flex;flex-wrap:wrap;gap:6px}
.reqs{display:grid;gap:8px}
.req{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:14px;padding:8px 10px;background:var(--line);font-weight:700;font-size:14px}
.req .ra{display:flex;gap:6px}
.req .chip{font-size:14px;padding:4px 12px;box-shadow:0 2px 0 var(--ink)}
#pres{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-weight:900;font-size:13px}
#pres span{background:var(--paper);border:2px solid var(--ink);border-radius:99px;padding:3px 10px;white-space:nowrap}
#pres .b{color:var(--blue)} #pres .r{color:var(--red)}
.dot.empty{background:var(--line);border-style:dashed}
.dot.seat{cursor:pointer;padding:0}
a.chip{text-decoration:none;color:var(--ink);display:inline-block}
.ttl-link{text-decoration:none;color:inherit}
.ig{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:4px 14px 4px 6px;font:900 15px var(--body);box-shadow:0 3px 0 var(--ink);margin-top:-2px}
.ig:hover{background:var(--sun)}
.igi{width:24px;height:24px;border-radius:7px;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285aeb 90%);position:relative;flex:none}
.igi::before{content:"";position:absolute;inset:5px;border:2px solid #fff;border-radius:50%}
.igi::after{content:"";position:absolute;top:4px;right:4px;width:3px;height:3px;border-radius:50%;background:#fff}
.plink{color:inherit;text-decoration:none}
.plink:hover{text-decoration:underline}
.igmini{display:inline-grid;place-items:center;vertical-align:middle;margin-left:4px}
.igmini .igi{width:22px;height:22px}
.hlab{position:absolute;transform:translate(-50%,calc(-100% - 10px));pointer-events:auto;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:99px;padding:4px 10px 4px 6px;font:800 13px var(--body);color:var(--ink);box-shadow:0 3px 0 var(--ink);white-space:nowrap;z-index:3}
.hlab::after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--ink)}
.hlab b{font-weight:900;font-size:14px}
.hlab .hlv{color:var(--muted);font-weight:800;font-size:12px}
.hlab em{font-style:normal;background:var(--sun);border-radius:99px;padding:1px 7px;font-size:10.5px;font-weight:900;letter-spacing:.04em}
.hlab:hover{background:var(--sun)}
#toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;font-family:var(--display);font-size:20px;padding:10px 18px;z-index:10;transition:opacity .2s,transform .2s;text-align:center;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

@media (max-width:760px){
  .help{width:40px;height:40px;font-size:19px}
  .ttl{padding-right:48px;justify-content:flex-start}
  .ttl h1{text-align:left}
  .sbox b{font-size:18px}
  #q{font-size:16px;padding:10px 0}
  .go{font-size:17px;padding:0 16px}
  #panel{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:auto;max-height:56%;min-height:0}
  #zoom{bottom:calc(200px + env(safe-area-inset-bottom,0px))}
  #zoom button{width:46px;height:46px;font-size:24px}
  .chip{font-size:15px;padding:6px 12px}
  .lab .n{font-size:16px;-webkit-text-stroke:4px var(--ink)}
  .lab .k{font-size:11px;-webkit-text-stroke:3px var(--ink)}
  .lv{grid-template-columns:repeat(3,1fr)}
}
@media (prefers-reduced-motion:reduce){.merow.need .side{animation:none}.bar i{transition:none}}
</style>

<div id="app">
<div id="loading" style="position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#a9d8f2;text-align:center;padding:16px">
  <div class="out" style="font-size:44px;line-height:1">vou ser <em style="font-style:normal;color:#ffc93c">presidente</em></div>
  <div class="card" style="padding:10px 18px;font:800 16px Nunito,system-ui,sans-serif">Carregando o mapa do Brasil…</div>
</div>
  <canvas id="c" aria-label="Mapa 3D do Brasil com as cidades em disputa"></canvas>
  <div id="labels"></div>

  <header id="top">

      <a class="ttl-link" href="https://www.instagram.com/vouserpresidente/" target="_blank" rel="noopener" aria-label="Abrir @vouserpresidente no Instagram"><h1 class="out">vou ser <em>presidente</em></h1></a>
      <button class="help" id="helpBtn" aria-label="Como jogar">?</button>

      if (tab === 'aliado') { const f = cleanH(val('jFriend')); txt += ` @${f || 'amigo'}`; if (f && players[f] && ci !== null && !players[f].casas.includes(ci)) warn = `@${f} ainda não mora em ${ctag(ci)}: a aliança só vale quando ele tiver casa lá.`; }
    } else if (tab === 'aceitar') { const f = cleanH(val('jFrom')); txt = `aceito @${f || 'quem_te_convidou'}`; }
    else txt = 'segui ✅';
    mc.querySelector('#jPrev').textContent = txt; mc.querySelector('#jWarn').textContent = warn;
    return txt;
  };
  mc.querySelectorAll('input').forEach(i => i.oninput = build);
  mc.querySelectorAll('[data-sd]').forEach(b => b.onclick = () => { joinSide = b.dataset.sd; mc.querySelectorAll('[data-sd]').forEach(x => x.setAttribute('aria-pressed', x.dataset.sd === joinSide)); build(); });
  mc.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => openJoin(b.dataset.tab, { city:val('jCity'), from:val('jFrom') }));
  mc.querySelector('#jGo').onclick = () => copyGo(build());
  const sb = mc.querySelector('#shareBtn');
  if (sb) sb.onclick = async () => {
    const url = location.origin + location.pathname, text = 'Vem construir o Brasil nos comentários! Escolha seu lado e ganhe sua casa no mapa 🇧🇷';
    try { if (navigator.share) await navigator.share({ title:'Vou Ser Presidente', text, url }); else { await navigator.clipboard.writeText(text + ' ' + url); toast('Link copiado!'); } } catch (x) {}
  };
  build();
}

  };

      ${Object.keys(OFF.gov).sort().map(uf => { const b2 = x => x ? `<button class="pp go" data-h="${html(x)}">${html(showH(x))} · ${wkOf(players[x])} pts</button>` : '<span class="note">vaga</span>'; return `<tr><td>${uf}</td><td>${b2(OFF.gov[uf])}</td><td>${b2(OFF.sen[uf])}</td><td>${[0, 1].map(i => b2((OFF.dep[uf] || [])[i])).join(' ')}</td></tr>`; }).join('')}</tbody></table></div>` : ''}

    ${ks.length ? `<h2 style="font-size:22px;margin-top:16px">👑 Reis dos estados</h2><div class="tw"><table><tbody>
      ${ks.map(([uf, k]) => `<tr><td>${uf}</td><td>${STATE[uf]}</td><td>👑 ${html(showH(k.h))}</td><td>${k.sc} pts</td></tr>`).join('')}</tbody></table></div>` : ''}`);
  $('mcard').querySelectorAll('[data-h]').forEach(b => b.onclick = () => openProfile(b.dataset.h));
}
$('cRank').onclick = openRanking;

function openCities() {

    return `<tr><td>${i + 1}</td><td><button class="chip" style="font-size:14px;padding:3px 10px;box-shadow:none;border-width:2px" data-ci="${c.i}">${html(c.name)} - ${c.uf}</button></td><td><b>${fmt(t)}</b></td>
      <td>${d ? sideEmo(d) : '⚖️'} <small>${Math.round(c.b / t * 100)}% · ${Math.round(c.r / t * 100)}%${c.n ? ` · ${Math.round(c.n / t * 100)}%` : ''}</small></td>
